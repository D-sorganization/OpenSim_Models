# spec-check.yml � Specification Freshness Enforcement
name: Spec Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: spec-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  spec-freshness:
    name: Verify SPEC.md freshness
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'spec-exempt') }}
    timeout-minutes: 5

    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git config --local --unset-all http.https://github.com/.extraheader || true
          { git config --local --name-only --get-regexp '^includeIf\.gitdir:.*\.path$' 2>/dev/null || true; } \
            | while IFS= read -r key; do git config --local --unset-all "$key" || true; done
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" --no-tags --depth=10000
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch origin "$GITHUB_SHA" --no-tags --depth=10000
          git checkout --force FETCH_HEAD
          git clean -ffdx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check if source files changed without SPEC.md update
        id: check
        shell: bash
        run: |
          python3 scripts/ci/check_spec_freshness.py --base "origin/${{ github.base_ref }}" | tee -a "$GITHUB_OUTPUT"

      - name: Fail if spec is stale
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        run: |
          echo "::error::Source files changed but SPEC.md was not updated."
          exit 1
