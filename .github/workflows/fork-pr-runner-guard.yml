name: Fork PR Runner Guard

# Fails when any workflow job can run fork pull-request code on the d-sorg
# self-hosted fleet (Repository_Management#1989, Tools#4464). Fork PRs are routed to a
# GitHub-hosted runner so they get the verdict too (public repo default: hosted). Logic: scripts/fork_pr_runner_guard.py.

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/fork_pr_runner_guard.py"
      - "scripts/fork_pr_guard_analysis.py"
  merge_group:
  push:
    branches-ignore: ["gh-readonly-queue/**"]
    paths:
      - ".github/workflows/**"
      - "scripts/fork_pr_runner_guard.py"
      - "scripts/fork_pr_guard_analysis.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-pr-runner-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-pr-runner-guard:
    name: Verify no job runs fork PR code on the self-hosted fleet
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet' }}
    timeout-minutes: 5
    steps:
      - name: Checkout repository without external actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --force FETCH_HEAD

      - name: Verify no job runs fork PR code on the self-hosted fleet
        run: python3 scripts/fork_pr_runner_guard.py
